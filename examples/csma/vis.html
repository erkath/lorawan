<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>D3.js 2D Points Visualization with Size</title>
    <script src="https://d3js.org/d3.v7.min.js "></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
        }
        svg {
            background-color: #f9f9f9;
            display: block;
        }
        .dot {
            fill: #0b74ca;
            opacity: 0.3;
        }
        .line-to-center {
            stroke: #555;
            stroke-width: 1;
            fill: none;
            opacity: 0.05;
        }
        .center-circle {
            fill: #229a14;
            fill-opacity: 0.5;
            stroke: #229a14;
            stroke-width: 4px;
        }
        .axis path,
        .axis line {
            stroke: #333;
            shape-rendering: crispEdges;
        }
    </style>
</head>
<body>
<svg id="graph"></svg>

<script>
    // Sample data: array of 2D points with size
    const data = [
        // TODO: insert data
    ];

    // Set up dimensions
    const width = window.innerWidth;
    const height = window.innerHeight;

    const margin = { top: 20, right: 20, bottom: 50, left: 60 };

    // Create SVG container
    const svg = d3.select("#graph")
        .attr("width", width)
        .attr("height", height);
    const g = svg.append("g");

    // Set up scales
    const xScale = d3.scaleLinear()
        .domain([-1100, 1100])
        .range([margin.left, width - 50]);

    const yScale = d3.scaleLinear()
        .domain([-1100, 1100])
        .range([height - 50, margin.bottom]); // Y axis grows downward

    // Zoom behavior
    const zoom = d3.zoom()
        .scaleExtent([0.5, 5]) // min and max zoom levels
        .translateExtent([[0, 0], [width, height]])
        .on("zoom", zoomed);

    svg.call(zoom);

    function zoomed(event) {
        const newTransform = event.transform;
        g.attr("transform", newTransform);
    }

    // Draw lines from each point to (0,0)
    const originX = xScale(0);
    const originY = yScale(0);

    g.selectAll(".line-to-center")
        .data(data)
        .enter()
        .append("line")
        .attr("class", "line-to-center")
        .attr("x1", originX)
        .attr("y1", originY)
        .attr("x2", d => xScale(d.x))
        .attr("y2", d => yScale(d.y));

    // Draw circles for each point using 'size' field
    const dots = g.selectAll(".dot")
        .data(data)
        .enter()
        .append("circle")
        .attr("class", "dot")
        .attr("cx", d => xScale(d.x))
        .attr("cy", d => yScale(d.y))
        .attr("r", d => (d.z * 5)) // Use size value from data
        .append("title") // Tooltip
        .text(d => `(${d.x}, ${d.y}), size: ${d.size}`);

    // Draw circle at origin (0,0)
    g.append("circle")
        .attr("class", "center-circle")
        .attr("cx", originX)
        .attr("cy", originY)
        .attr("r", xScale(1000) - xScale(0))  // radius of 100 in screen space
        .attr("opacity", 0.3);

    // Optional: add axes
    const xAxis = d3.axisBottom(xScale);
    const yAxis = d3.axisLeft(yScale);

    const gx = g.append("g")
        .attr("transform", `translate(0,${height - margin.bottom})`)
        .call(xAxis)
        .selectAll(".tick text")
        .style("font-size", "18px");

    const gy = g.append("g")
        .attr("transform", `translate(${margin.left},0)`)
        .call(yAxis)
        .selectAll(".tick text")
        .style("font-size", "18px");

    // Optional: Reset zoom button
    const resetBtn = document.createElement("button");
    resetBtn.innerText = "Reset Zoom";
    resetBtn.style.position = "absolute";
    resetBtn.style.top = "10px";
    resetBtn.style.left = "10px";
    document.body.appendChild(resetBtn);

    resetBtn.addEventListener("click", () => {
        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });
</script>
</body>
</html>
